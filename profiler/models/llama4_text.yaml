# Llama 4 text decoder. Dense FFNs require their own profile rows.
sequence:
  prologue: [embedding]
  pre_attn: [layernorm, qkv_proj, attention]
  post_attn: [o_proj, layernorm]
  mlp_dense: [gate_up_proj, act_fn, down_proj]
  mlp_moe: [moe]
  head: [final_layernorm, lm_head, sampler]

catalog:
  dense:
    embedding:
      vllm: VocabParallelEmbedding
    layernorm:
      vllm: RMSNorm
      within: Llama4DecoderLayer
      tp_stable: true
    qkv_proj:
      vllm: QKVParallelLinear
    o_proj:
      vllm: RowParallelLinear
    gate_up_proj:
      vllm: MergedColumnParallelLinear
    act_fn:
      vllm: SiluAndMul
    down_proj:
      vllm: RowParallelLinear
    final_layernorm:
      vllm: RMSNorm
      within: Llama4ForCausalLM
      tp_stable: true
  attention:
    attention:
      vllm: Attention
  per_sequence:
    lm_head:
      vllm: LogitsProcessor
    sampler:
      vllm: Sampler
      tp_stable: true
  moe:
    moe:
      vllm: Llama4MoE
