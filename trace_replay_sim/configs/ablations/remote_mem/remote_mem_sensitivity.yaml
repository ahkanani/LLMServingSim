base_config: configs/experiments/remote_mem/full_runs/008_qwen3_235b_a22b_fp8_mmlu_remote_mem_bw09.yaml
sweep:
  name: remote_mem_sensitivity
  output_dir: runs/remote_mem/sweeps
  run_id_template: '{sweep_id}_{index:03d}_{params_slug}'
  parameters:
    placement.hot_fraction:
    - 0.25
    - 0.5
    - 0.75
    placement.cold_fraction:
